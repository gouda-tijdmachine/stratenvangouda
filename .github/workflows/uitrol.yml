# Dagelijkse verversing en uitrol naar de server van Die Goude (route b).
#
# Dagelijks (schedule): conditionele sync met --alleen-bij-wijziging — bij een
# 304 van de bron (exitcode 3) worden herbouw en uitrol overgeslagen.
# Handmatig (workflow_dispatch) of een push naar main: altijd volledige sync +
# build + uitrol (docs-only pushes zijn uitgezonderd via paths-ignore hieronder).
#
# Uitrol gaat via FTPS (expliciete FTP over TLS) naar de gedeelde Vimexx-
# hosting; het account is gechroot in de webmap van het domein, dus het
# doelpad is simpelweg "/". Let op (afspraken met Richard, sept 2026):
#  - host is web0155.zxcs.nl, níet het domein — het FTP-certificaat is
#    *.zxcs.nl en de domeinnaam geeft dus een certificaatfout;
#  - de server dwingt TLS niet af, dus het protocol staat hier expliciet op
#    ftps zodat het wachtwoord nooit onversleuteld over de lijn gaat;
#  - de ProFTPD eist TLS-sessiehergebruik op het datakanaal; een client die
#    dat niet kan strandt op "425 Unable to build data connection". Daarom
#    lftp en níet SamKirkland/FTP-Deploy-Action: de onderliggende Node-
#    library (basic-ftp) hergebruikt de TLS-sessie niet en breekt direct af
#    met "read ECONNRESET (data socket)" — proefondervindelijk vastgesteld
#    op 11 sept 2026 (run 34573455861);
#  - de FTP-server stuurt alleen het leaf-certificaat mee, zonder het
#    Sectigo-tussencertificaat. Dat tussencertificaat ligt daarom vast in
#    .github/sectigo-server-auth-dv-r36.pem (geldig t/m maart 2036) en gaat
#    hieronder mee in de CA-bundel, zodat certificaatverificatie gewoon aan
#    kan blijven.
name: Bouw en uitrol

on:
  push:
    branches: [main]
    # Docs/CI-only wijzigingen hoeven geen volledige uitrol te starten.
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "docs/**"
      - ".github/**"
  schedule:
    - cron: "17 4 * * *" # dagelijks 04:17 UTC (05:17/06:17 NL)
  workflow_dispatch:

concurrency:
  group: uitrol
  cancel-in-progress: false

jobs:
  bouw-en-publiceer:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # cache.db van de vorige run terughalen zodat de conditionele sync met
      # de bewaarde ETag/Last-Modified-validators kan werken.
      - name: Vorige cache.db terughalen
        uses: actions/cache/restore@v6
        with:
          path: data/cache.db
          key: cachedb-${{ github.run_id }}
          restore-keys: cachedb-

      - name: Sync (dagelijks, alleen bij wijziging)
        id: sync
        if: github.event_name == 'schedule'
        run: |
          set +e
          node scripts/sync.mjs --alleen-bij-wijziging
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "Bron ongewijzigd; herbouw en uitrol worden overgeslagen."
            echo "gewijzigd=nee" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 0 ]; then
            echo "gewijzigd=ja" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Sync (handmatig of bij push, volledig)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: npm run sync

      - name: Statische build
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.sync.outputs.gewijzigd == 'ja'
        # De cp is een vangnet: de .htaccess van Richard (public/.htaccess,
        # sinds 11 sept 2026 is de repo-versie leidend) moet gegarandeerd in
        # out/ zitten, ook als de export verborgen bestanden zou overslaan.
        run: |
          npm run build
          cp public/.htaccess out/.htaccess
        env:
          SITE_URL: https://stratenvangouda.nl
          NEXT_PUBLIC_MATOMO_URL: https://stats.diegoude.nl
          NEXT_PUBLIC_MATOMO_SITE_ID: "1"

      # Spiegelt out/ naar de webmap in twee passes. Pass 1 (--ignore-time)
      # vergelijkt op grootte: elke build geeft alle bestanden nieuwe tijd-
      # stempels, dus op tijd vergelijken zou dagelijks alle ~30k bestanden
      # opnieuw uploaden (ruim anderhalf uur over FTP). Nadeel: HTML-pagina's
      # houden bij een nieuwe build vaak dezelfde grootte (alleen de build-id/
      # chunk-hash in de verwijzingen wijzigt) en worden dan overgeslagen —
      # daardoor bleef de homepage naar oude chunks verwijzen. Pass 2 uploadt
      # daarom alle *.html opnieuw op tijd. Bewust géén --delete zolang de
      # build-id per build wisselt: reeds geüploade pagina's verwijzen naar hun
      # eigen _next/static/<buildId>/-manifest en die moeten blijven staan.
      # .well-known blijft uitgesloten (acme-challenge van de hoster); de
      # .htaccess gaat sinds 11 sept 2026 juist wél mee, want de versie in
      # de repository (public/.htaccess) is leidend.
      - name: Uitrol via FTPS
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.sync.outputs.gewijzigd == 'ja'
        env:
          FTPS_HOST: ${{ secrets.FTPS_HOST }}
          FTPS_GEBRUIKER: ${{ secrets.FTPS_GEBRUIKER }}
          FTPS_WACHTWOORD: ${{ secrets.FTPS_WACHTWOORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          # Tussencertificaat per run vers ophalen via de AIA-URL uit het
          # servercertificaat (verzoek Richard, 12 sept 2026): zo overleeft
          # de uitrol een wissel van certificaatuitgever bij Vimexx. De
          # AIA-download gaat over kaal http, dus het opgehaalde certificaat
          # wordt pas vertrouwd nadat leaf + tussencertificaat samen tegen
          # de systeemroots verifiëren; anders terugval op de vastgelegde
          # kopie in de repository.
          tussen=.github/sectigo-server-auth-dv-r36.pem
          leaf_ok=false
          for poging in 1 2 3; do
            if timeout 60 openssl s_client -connect "$FTPS_HOST:21" -starttls ftp </dev/null 2>/dev/null | openssl x509 -out /tmp/leaf.pem 2>/dev/null; then
              leaf_ok=true
              break
            fi
            echo "Servercertificaat ophalen mislukt (poging $poging van 3)."
            sleep 10
          done
          if $leaf_ok; then
            aia=$(openssl x509 -in /tmp/leaf.pem -noout -text | grep -o 'http://[^[:space:]]*\.crt' | head -1)
            if [ -n "$aia" ] && curl -fsS --max-time 30 "$aia" -o /tmp/tussen.bin; then
              openssl x509 -inform DER -in /tmp/tussen.bin -out /tmp/tussen.pem 2>/dev/null \
                || openssl x509 -in /tmp/tussen.bin -out /tmp/tussen.pem 2>/dev/null \
                || true
              if [ -s /tmp/tussen.pem ] && openssl verify -untrusted /tmp/tussen.pem /tmp/leaf.pem >/dev/null 2>&1; then
                tussen=/tmp/tussen.pem
                echo "Tussencertificaat opgehaald en geverifieerd via $aia"
              else
                echo "Opgehaald tussencertificaat verifieert niet; terugval op vastgelegde kopie."
              fi
            else
              echo "Geen AIA-URL gevonden of download mislukt; terugval op vastgelegde kopie."
            fi
          else
            echo "Servercertificaat niet op te halen; terugval op vastgelegde kopie."
          fi
          cat /etc/ssl/certs/ca-certificates.crt "$tussen" > /tmp/ca-bundel.pem

          lftp -p 21 -u "$FTPS_GEBRUIKER,$FTPS_WACHTWOORD" "ftp://$FTPS_HOST" <<'LFTP'
          set ssl:ca-file "/tmp/ca-bundel.pem"
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:timeout 30
          set net:max-retries 2
          set net:persist-retries 2
          set cmd:fail-exit true
          # Pass 1 (op grootte, snel): _next/static is content-hashed en immutable,
          # dus nieuwe builds voegen enkel nieuwe bestanden toe.
          mirror -R --ignore-time --parallel=5 --exclude-glob .ftpquota --exclude-glob .well-known/ out/ /
          # Pass 2 (HTML op tijd): HTML-pagina's houden bij een nieuwe build vaak
          # dezelfde grootte (enkel de build-id/chunk-hash in de verwijzingen
          # wijzigt), dus pass 1 slaat ze over en bleef de oude HTML naar oude
          # chunks wijzen. Een verse build geeft alle bestanden nieuwe tijdstempels,
          # dus op tijd vergelijken (zónder --ignore-time) dwingt de herupload af.
          # _next/ en data/ blijven uitgesloten: _next is content-hashed en te groot
          # om te heruploaden, en data-bestanden dekt pass 1 al op grootte. Let op:
          # exclude via regex (--exclude), níet --exclude-glob — een glob met
          # trailing slash sluit de submap hier niet uit (dan wordt tóch alles
          # opnieuw geüpload).
          mirror -R --parallel=5 --exclude '_next/' --exclude 'data/' --exclude-glob .ftpquota --exclude-glob .well-known/ out/ /
          bye
          LFTP

      - name: cache.db bewaren voor de volgende run
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.sync.outputs.gewijzigd == 'ja'
        uses: actions/cache/save@v6
        with:
          path: data/cache.db
          key: cachedb-${{ github.run_id }}
